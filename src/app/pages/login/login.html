<div class="login-container">

  <div class="login-card">

    <!-- ======================================
         MARCA
    ======================================= -->

    <div class="brand">

      <div class="brand-icon">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M14.5 6.5 17.5 3.5" />
          <path d="m13 8 3 3" />
          <path d="M3 21 12.5 11.5" />
          <path d="m5 19 3 2 2-2-3-3-2 2Z" />
          <path d="m14 4 6 6" />
          <path d="m17 1 6 6" />
        </svg>
      </div>

      <h1>
        Ferretera <span>GUM</span>
      </h1>

      <p>
        Sistema de Gestión
      </p>

    </div>


    <!-- ======================================
         FORMULARIO
    ======================================= -->

    <div class="login-form">

      <div class="form-heading">

        <h2>Iniciar sesión</h2>

        <p>
          Ingresa tus credenciales para continuar
        </p>

      </div>


      <form (ngSubmit)="login()">

        <!-- USUARIO -->

        <div class="form-group">

          <label for="username">
            Usuario
          </label>

          <div class="input-wrapper">

            <svg
              class="input-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M20 21a8 8 0 0 0-16 0" />
              <circle cx="12" cy="7" r="4" />
            </svg>

            <input
              id="username"
              type="text"
              name="username"
              [(ngModel)]="username"
              placeholder="Ingresa tu usuario"
              autocomplete="username"
              required
            />

          </div>

        </div>


        <!-- CONTRASEÑA -->

        <div class="form-group">

          <label for="password">
            Contraseña
          </label>

          <div class="input-wrapper">

            <svg
              class="input-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect
                x="3"
                y="11"
                width="18"
                height="10"
                rx="2"
              />

              <path d="M7 11V7a5 5 0 0 1 10 0v4" />

            </svg>

            <input
              id="password"
              type="password"
              name="password"
              [(ngModel)]="password"
              placeholder="Ingresa tu contraseña"
              autocomplete="current-password"
              required
            />

          </div>

        </div>


        <!-- ERROR -->

        @if (errorMessage) {

          <div class="error-message">

            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="12" r="10" />
              <line x1="12" y1="8" x2="12" y2="12" />
              <line x1="12" y1="16" x2="12.01" y2="16" />
            </svg>

            <span>
              {{ errorMessage }}
            </span>

          </div>

        }


        <!-- BOTÓN -->

        <button
          type="submit"
          class="login-btn"
          [disabled]="loading"
        >

          @if (loading) {

            <span class="spinner"></span>

            <span>
              Iniciando...
            </span>

          } @else {

            <span>
              Entrar
            </span>

            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <line
                x1="5"
                y1="12"
                x2="19"
                y2="12"
              />

              <polyline
                points="12 5 19 12 12 19"
              />
            </svg>

          }

        </button>

      </form>

    </div>


    <!-- ======================================
         FOOTER
    ======================================= -->

    <div class="login-footer">

      <span>Ferretera GUM</span>

      <span class="separator">•</span>

      <span>Sistema de Gestión</span>

    </div>

  </div>

</div>
