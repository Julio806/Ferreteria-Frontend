<div class="app-layout">

  <!-- SIDEBAR -->
  <aside class="sidebar">

    <div class="sidebar-brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round">
          <path d="M14.5 4.5l5 5" />
          <path d="M13 6l-3 3" />
          <path d="M4 20l7-7" />
          <path d="M3 21l3-1 8-8-3-3-8 8z" />
          <path d="M14 3l7 7" />
        </svg>
      </div>

      <div class="brand-text">
        <h1>FERRETERA<span> GUM</span></h1>
        <p>SISTEMA DE GESTIÓN</p>
      </div>
    </div>

    <!-- USUARIO DEL MENÚ LATERAL -->
    <div class="sidebar-user">
      <div class="user-avatar">
        {{ inicialUsuario }}
      </div>

      <div class="user-info">
        <strong>{{ username }}</strong>
        <span>{{ rol }}</span>
      </div>
    </div>

    <!-- NAVEGACIÓN -->

    <nav class="sidebar-nav">

      <div class="nav-section">
        <span class="nav-title">PRINCIPAL</span>

        <!-- DASHBOARD: ADMIN Y VENDEDOR -->
        <a routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
          class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 10.5L12 3l9 7.5" />
            <path d="M5 9.5V21h14V9.5" />
            <path d="M9 21v-7h6v7" />
          </svg>
          <span>Dashboard</span>
        </a>

        <!-- INVENTARIO -->
        <a routerLink="/productos" routerLinkActive="active" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path
              d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z" />
            <path d="M3.27 6.96L12 12.01l8.73-5.05" />
            <path d="M12 22.08V12" />
          </svg>
          <span>Inventario</span>
        </a>

        <!-- CATEGORÍAS -->
        <a routerLink="/categorias" routerLinkActive="active" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20.59 13.41L11 3.83V3H4v7h.83l9.58 9.59a2 2 0 0 0 2.83 0l3.35-3.35a2 2 0 0 0 0-2.83z" />
            <circle cx="7.5" cy="7.5" r="1" />
          </svg>
          <span>Categorías</span>
        </a>

        <!-- VENTAS -->
        <a routerLink="/ventas" routerLinkActive="active" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 3h2l2.4 11.2a2 2 0 0 0 2 1.6h7.8a2 2 0 0 0 2-1.6L21 7H6" />
            <circle cx="10" cy="20" r="1.5" />
            <circle cx="18" cy="20" r="1.5" />
          </svg>
          <span>Ventas</span>
        </a>


        <!-- CATÁLOGO TRUPER: ADMIN Y VENDEDOR -->
        <a href="https://www.truper.com/CatVigente/" target="_blank" rel="noopener noreferrer" class="nav-item">

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" />
            <path d="M8 7h8" />
            <path d="M8 11h8" />

          </svg>

          <span>Catálogo Truper</span>
        </a>

        <!-- EXCLUSIVO ADMIN -->
        @if (isAdmin()) {

        <!-- ABASTECIMIENTO -->
        <a routerLink="/compras" routerLinkActive="active" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M6 2h9l4 4v16H6z" />
            <path d="M14 2v5h5" />
            <path d="M9 13h6" />
            <path d="M9 17h6" />
          </svg>
          <span>Abastecimiento</span>
        </a>

        <!-- REPORTES -->
        <a routerLink="/reportes" routerLinkActive="active" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2" />
            <path d="M8 16v-4" />
            <path d="M12 16V8" />
            <path d="M16 16v-6" />
          </svg>
          <span>Reportes</span>
        </a>

        }

      </div>

      <!-- ADMINISTRACIÓN: EXCLUSIVO ADMIN -->
      @if (isAdmin()) {

      <div class="nav-section">
        <span class="nav-title">ADMINISTRACIÓN</span>

        <!-- USUARIOS -->
        <a routerLink="/usuarios" routerLinkActive="active" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="9" cy="7" r="4" />
            <path d="M2 21c0-4 3-7 7-7s7 3 7 7" />
            <path d="M17 11c2.8 0 5 2.2 5 5" />
            <path d="M17 3.5a3.5 3.5 0 0 1 0 7" />
          </svg>
          <span>Usuarios</span>
        </a>

        <!-- ROLES -->
        <a routerLink="/roles" routerLinkActive="active" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7z" />
            <path d="M9 12l2 2 4-4" />
          </svg>
          <span>Roles</span>
        </a>

      </div>

      }

    </nav>


    <!-- ESTADO -->
    <div class="sidebar-status">
      <span class="status-dot"></span>
      <span>Sistema activo</span>
    </div>

  </aside>

  <!-- CONTENIDO PRINCIPAL -->
  <div class="main-wrapper">

    <!-- ENCABEZADO ÚNICO CON NOTIFICACIONES -->
    <app-header></app-header>

    <main class="page-content">
      <router-outlet></router-outlet>
    </main>

  </div>

</div>
